[workspace]
resolver = "3"
members = [
    "crates/depaudit-core",
    "crates/depaudit-cli",
    "crates/depaudit-db",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Joseph Edwards <josephleonedwards@gmail.com>"]
repository = "https://github.com/josephleoned/depaudit"
description = "A fast, offline-capable polyglot dependency and supply-chain auditor."

[workspace.dependencies]
# Shared across crates — each crate opts in via `dep.workspace = true`
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
toml = "0.8"
semver = { version = "1", features = ["serde"] }
walkdir = "2"
clap = { version = "4", features = ["derive"] }
owo-colors = "4"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
